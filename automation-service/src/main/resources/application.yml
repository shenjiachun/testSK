spring:
  application:
    name: automation-service
  datasource:
    url: jdbc:h2:mem:automationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      # Use 'create-drop' for development only. Override with 'validate' or 'none' in production.
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-3-5-haiku-20241022
  max-tokens: 1024

scheduler:
  pool-size: 5

logging:
  level:
    com.automation: INFO
